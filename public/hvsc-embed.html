<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>HVSC Browser — powered by SIDquake</title>
    <noscript><link rel="stylesheet" href="icons.css"></noscript>
    <script>requestAnimationFrame(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='icons.css';document.head.appendChild(l)});</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-deferred.css">
    <link rel="stylesheet" href="hvsc-browser.css">
    <!-- Reads the ?query into window.HVSC_EMBED, the palette custom properties
         and the hvsc-no-* chrome classes the rules below act on. Must run
         before hvsc-browser.js, and before first paint so the configured
         palette is the only one ever shown. -->
    <script src="hvsc-embed-config.js"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        /* align-items:stretch overrides the shared styles.css body rule (which
           centers the main app's .container); without it .embed-root shrinks to
           its content and the browser appears to resize between folders. */
        /* The font stack is hvsc-browser.css's; named here so ?font= can
           replace it without the default becoming the app's webfont, which
           this page never loads. */
        body {
            display: flex; flex-direction: column; align-items: stretch;
            background: var(--bg-primary);
            font-family: var(--hvsc-font, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif);
        }
        .embed-root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .embed-root .browser-container { height: 100%; }
        /* Footer: subtle attribution + backlink to SIDquake */
        .hvsc-embed-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 6px 12px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-muted);
            background: var(--bg-elevated);
            border-top: 1px solid var(--border);
        }
        .hvsc-embed-footer a { color: var(--text-secondary); text-decoration: none; }
        .hvsc-embed-footer a:hover { text-decoration: underline; }
        .hvsc-embed-terms { flex: 1 1 auto; min-width: 200px; }
        .hvsc-embed-brand { font-weight: 700; white-space: nowrap; }
        .hvsc-embed-brand a { color: var(--accent); }

        /* ------------------------------------------------------------------
           Chrome options. hvsc-embed-config.js puts an hvsc-no-* class on
           <html> for each part the embedder turned off; doing it in CSS rather
           than by hand means it applies to controls the browser builds later
           (the list header, the info panel's buttons) without any ordering
           dance. The attribution footer is deliberately not switchable — the
           embed terms require it.
           ------------------------------------------------------------------ */
        .hvsc-no-title .browser-title { display: none; }
        .hvsc-no-badge #hvscVersionBadge { display: none !important; }
        .hvsc-no-search .browser-search { display: none; }
        .hvsc-no-header .browser-header,
        .hvsc-no-title.hvsc-no-search .browser-header { display: none; }

        .hvsc-no-nav #homeBtn,
        .hvsc-no-nav #upBtn { display: none; }
        .hvsc-no-sortui .hvsc-col { display: none; }
        .hvsc-no-year .hvsc-col-year,
        .hvsc-no-year .file-year { display: none; }
        .hvsc-no-nav.hvsc-no-sortui #hvscListHeader { display: none; }

        .hvsc-no-info .sid-info-panel { display: none !important; }
        .hvsc-no-stil .sid-info-stil { display: none; }
        .hvsc-no-download #hvscDownloadBtn { display: none; }
        .hvsc-no-share #hvscShareBtn { display: none; }
        .hvsc-no-download.hvsc-no-share .sid-info-download { display: none; }

        .hvsc-no-player .hvsc-player-container { display: none !important; }
        .hvsc-no-credit .sid-player-credit { display: none; }
        .hvsc-no-viz .hvsc-visualizer { display: none !important; }

        .hvsc-no-count #itemCount { display: none; }
        .hvsc-no-path #pathBar { display: none; }
        .hvsc-no-select .hvsc-choose-btn { display: none; }
        .hvsc-no-status .status-bar,
        .hvsc-no-count.hvsc-no-path.hvsc-no-select .status-bar { display: none; }
    </style>
</head>
<body>
    <div class="embed-root">
        <div class="browser-container">
            <div class="browser-header">
                <div class="browser-title"><span class="browser-title-text">HVSC Browser</span><span class="hvsc-version-badge" id="hvscVersionBadge" hidden></span></div>
                <div class="browser-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-bar" id="hvscSearchBar" placeholder="Search HVSC by title, author, or comment..." autocomplete="off" spellcheck="false">
                    <button class="search-clear" id="hvscSearchClear" title="Clear search" style="display: none;">✕</button>
                </div>
            </div>

            <div class="browser-content">
                <div class="file-panel">
                    <div class="file-list" id="fileList">
                        <div class="file-list-loading"><div class="file-list-spinner"></div></div>
                    </div>
                </div>
                <div class="sid-info-panel" id="sidInfoPanel">
                    <div class="panel-header">SID Info</div>
                    <div class="sid-info-content" id="sidInfoContent">
                        <div class="sid-info-placeholder">Select a SID file to view details</div>
                    </div>
                </div>
            </div>

            <div class="status-bar">
                <span id="itemCount">0 items</span>
                <span class="hvsc-path-text" id="pathBar" title="Current HVSC folder"></span>
                <button class="btn hvsc-choose-btn" onclick="hvscBrowser.chooseSong()" title="Choose the selected tune"><i class="fas fa-check"></i> <span class="hvsc-choose-label">Select</span></button>
            </div>

            <div class="hvsc-player-container" id="hvscPlayerContainer">
                <div class="sid-player">
                    <button class="sid-player-btn sid-player-play" title="Play" disabled><i class="fas fa-play"></i></button>
                    <button class="sid-player-btn sid-player-stop" title="Stop" disabled><i class="fas fa-stop"></i></button>
                    <button class="sid-player-btn sid-player-restart" title="Restart" disabled><i class="fas fa-undo"></i></button>
                    <div class="sid-player-subtune">
                        <button class="sid-player-btn sid-player-prev" title="Previous subtune" disabled><i class="fas fa-step-backward"></i></button>
                        <span class="sid-player-subtune-display">1/1</span>
                        <button class="sid-player-btn sid-player-next" title="Next subtune" disabled><i class="fas fa-step-forward"></i></button>
                    </div>
                    <div class="sid-player-time">0:00</div>
                </div>
                <div class="sid-player-credit">Playback by <a href="https://github.com/libsidplayfp/libsidplayfp" target="_blank" rel="noopener">libsidplayfp</a> + reSIDfp</div>
            </div>

            <canvas class="hvsc-visualizer" id="hvscVizCanvas" aria-hidden="true"></canvas>
        </div>
    </div>

    <div class="hvsc-embed-footer">
        <span class="hvsc-embed-terms">
            Tunes &copy; their composers, for private listening &mdash; via the
            <a href="https://hvsc.c64.org/" target="_blank" rel="noopener">High Voltage SID Collection</a>.
            <a href="https://sidquake.c64demo.com/embed-terms.html" target="_blank" rel="noopener">Embed terms</a>.
        </span>
        <span class="hvsc-embed-brand">
            Powered by <a href="https://sidquake.c64demo.com/" target="_blank" rel="noopener">SIDquake</a>
        </span>
    </div>

    <script>
        // Minimal lazy script loader (hvsc-browser.js expects window.loadScript).
        window.lazyScripts = {};
        window.loadScript = function (src) {
            if (!window.lazyScripts[src]) {
                window.lazyScripts[src] = new Promise(function (resolve, reject) {
                    var s = document.createElement('script');
                    s.src = src; s.onload = resolve; s.onerror = reject;
                    document.head.appendChild(s);
                });
            }
            return window.lazyScripts[src];
        };
    </script>
    <script src="hvsc-browser.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            hvscBrowser.initializeHVSC();
            // Tell the host we're ready (handy for auto-sizing / wiring up).
            try {
                window.parent.postMessage({ type: 'hvsc:ready', mode: window.HVSC_EMBED.mode },
                    (window.HVSC_EMBED && window.HVSC_EMBED.targetOrigin) || '*');
            } catch (e) {}
            // Deep-link (?start=...) is honoured inside initializeHVSC via
            // window.HVSC_EMBED_START, so there's a single, race-free navigation.
        });
    </script>
</body>
</html>
