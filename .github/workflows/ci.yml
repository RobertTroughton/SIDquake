name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The committed player artifacts (code blobs, reloc tables, fixed-bank bins) are
  # generated from SIDPlayers/, and a stale blob against a fresh reloc table
  # silently corrupts every export - so the one thing worth checking automatically
  # is that what is committed still matches the source it came from.
  players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Committed player artifacts match the source
        run: scripts/build-players.sh --check

  # Both harnesses run the real assembled 6502 in the WASM 6510 emulator, over the
  # two data layouts the C64 players and the exporter have to agree on.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  # The committed .wasm files are built from wasm/ with emscripten 5.0.7, and that
  # build is reproducible byte for byte. Rebuilding them here checks they still
  # match their source, then the whole SID/ corpus is run against its goldens.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild the WASM modules
        run: |
          bash scripts/build-sidquake-wasm.sh
          bash scripts/build-sidplayfp-wasm.sh
      - name: Committed WASM matches the source
        run: git diff --exit-code -- public/sidquake.wasm public/sidquake.js public/sidplayfp.wasm public/sidplayfp.js
      - name: Every tune in SID/ matches its golden
        run: npm run test:goldens
